inheritance:
  gas_config: configs/gas_air_10k_d2q37_levelc_dx2p6.yaml
  round1_config: configs/phase5/a2a_operating_point/jacobian_ablation_10k_dx2p6.yaml
  round1_report: docs/Phase_5/wp4_jacobian_ablation_report.md
  plan: docs/Phase_5/WP4_JAB_next_simulation_guide_simple.md
jab2:
  unit_label: WP4-JAB2
  frequency_Hz: 1.0e4
  hs_rows: 48
  nx: 8
  samples_per_period: 64
  theta_points:
  - 0.05
  - 0.1
  settle_periods: 5.0
  drive_periods: 4.0
  fit_skip_periods: 2.0
  trend_theta: 0.075
jab2_smoke:
  unit_label: WP4-JAB2
  frequency_Hz: 1.0e4
  hs_rows: 12
  nx: 4
  samples_per_period: 32
  theta_points:
  - 0.05
  settle_periods: 2.0
  drive_periods: 2.0
  fit_skip_periods: 1.0
jvp:
  h_ladder:
  - 0.0001
  - 5.0e-05
  - 2.5e-05
  h_frozen: true
variants:
  A0r2: 全槽位热态(逐槽位仪器基线;须重过 V4)
  A2-1: band.W 的 rho_w 槽位冷基(壁平衡对密度的敏感度)
  A2-2: band.W 的 theta_w 槽位冷基(壁平衡对壁温的导数基点;η 输入通道不变)
  A2-3: band.N 全槽位冷基(内部 neq 复制/混合)
  A2-4: band.C 全槽位冷基(质量/动量平衡增量清除)
  A2-5: band.P 全槽位冷基(内能目标与 g 重钉扎)
  A3-1: macro.T 的 rho 槽位冷基(θ 恢复密度交叉项)
  A3-2: macro.U 的 rho 槽位冷基(u 恢复密度交叉项)
  A3-3: macro.E1 的 theta 槽位冷基(f_eq 温度矩)
  A3-4: macro.E2 全槽位冷基(g_eq 内能零矩+高阶矩)
  CTRLr2: band.L + macro.R(纯线性提取槽位;第二轮结构零阴性对照)
  A2ALL/A3ALL: 块并集锚(须复现第一轮整块消融;兼作 σ 分母)
interpretation:
  sigma_major: 0.5
  confirm_frac: 0.8
  combo_close_frac: 0.2
  negative_control_max_abs_S_pp: 0.01
  block_anchor_tol_pp: 0.05
  legality:
    mass_u_exact: 全变体机器级
    theta_pin_exact_except: A2-5
    theta_pin_a2_5_gate: 2.0
  classification:
    discrete_boundary:
    - A2-3
    - A2-4
    - A2-5
    continuum_physical:
    - A2-1
    - A2-2
    - A3-1
    - A3-2
    - A3-3
    - A3-4
    split_line: 0.7
gates:
  stationarity_per_period: 0.001
  state_match_rel: 0.01
  dc_closure_rel: 0.001
  v2_y_h_spread_rel: 1.0e-05
  v3_cold_amp_rel: 0.001
  v3_cold_phase_deg: 0.1
  v4_tan_identity_pp: 0.2
  v5_mass_tangent_rel: 1.0e-07
  v5_energy_account_rel: 1.0e-05
  r_f_max: 1.0e-05
  chain_vs_singleshot_rel: 1.0e-05
