    '0.10': archive/M5_runs/wp3_pdc2_20260802T104619Z
interpretation:
  close_line_frac: 0.5
  rules:
    primary_candidate: 同一模块在两个热工作点均闭合 ≥50% 且结果稳定向 QS-1 方向移动
    coupled_candidate: 单项均 <50% 但预注册组合在两点稳定跨过 50%
    local_sensitivity: 仅单点有效或方向相反 —— 记工作点局部敏感性,不称主机制
    not_closed: 全部单项与有限组合无显著作用 —— 保持 MECHANISM_NOT_CLOSED
  hard_stops:
  - 完整切线未全过 V0-V5
  - +h/-h 两支不同缓存或不同参考算子
  - 阴性对照偏移与主要候选同量级
  - 为符号翻转逐点调整步长/拟合窗/系数
  - 消融破坏质量中性/壁温钉扎/能量守恒
  - 生产求解器行为变化未触发合同 §23 定向复验
output:
  results_root: results/phase5/wp4_jacobian_ablation
  archive_root: archive/M5_runs
  verdict_family: SCOPED_CANDIDATE
