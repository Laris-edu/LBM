# A2a-STRICT_B 系综轴扫描配置（D0-7 诊断；计划=docs/Phase_5/a2asb_ensemble_scan_plan_v1.0.md）
# 唯一扫描变量=settle 初始列质量目标；边界/协议/读出=判决 run 逐字（worker 同一代码路径）。
# wet 质量点与冷锚经判决 run checkpoint 目录零新算力复用（质量目标传 pack 浮点原值→ident 位级一致）。
# 判读线冻结在 scripts/phase5_a2asb_ensemble_scan.py 常数区；auth 窗口/N_ref 阶梯对冻结常量硬断言。

inheritance:
  gas_config: configs/gas_air_10k_d2q37_levelc_dx2p6.yaml
  plan: docs/Phase_5/a2asb_ensemble_scan_plan_v1.0.md
  judgement_run: archive/M5_runs/a2asb_20260819_B    # run 20260819T155402Z
  tangent_anchors: archive/strict_b/hot_judgement.csv # 报告行对照，非判决

ensemble_scan:                    # 权威协议（B 机）
  frequency_Hz: 1.0e4
  n_phys: 48
  nx: 8
  samples_per_period: 64
  settle_periods: 5.0
  drive_periods: 4.0
  eps_ac_hot: 0.02                # 判决幅值；U_d=双窗差（预注册：无幅值对）
  eps_ac_cold: 0.005              # 共享冷锚（checkpoint 复用）
  fit_window_main: [2.0, 4.0]
  fit_window_alt: [1.5, 3.5]
  n_ref_ladder: [192, 384, 768]
  points:                         # 质量网格由 pack r(Θ)=M_wet(Θ)/M0 生成（计划 §1 公式）
    - {theta_dc: 0.05, grid: five_point}    # {r,(1+r)/2,1,(3−r)/2,2−r}
    - {theta_dc: 0.10, grid: three_point}   # {r,(1+r)/2,1}
  reference_pack: archive/a2a_strict_b/wet_reference_pack.json
  ckpt_dir: results/phase5/a2a_strict_b/checkpoints_auth_1117736   # 判决 run 复用

ensemble_scan_smoke:              # 机制演练（A 机；等质量刻度，无 wet 点）
  frequency_Hz: 1.0e4
  n_phys: 12
  nx: 4
  samples_per_period: 32
  settle_periods: 2.0
  drive_periods: 2.0
  eps_ac_hot: 0.02
  eps_ac_cold: 0.005
  fit_window_main: [1.0, 2.0]
  fit_window_alt: [0.5, 1.5]
  n_ref_ladder: [96, 192]
  points:
    - {theta_dc: 0.05, mass_rel: [0.976, 1.0, 1.024]}
    - {theta_dc: 0.10, mass_rel: [0.976, 1.0, 1.024]}
  ckpt_dir: results/phase5/a2asb_ensemble_scan/checkpoints_smoke
