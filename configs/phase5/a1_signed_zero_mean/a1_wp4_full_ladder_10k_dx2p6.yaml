# WP4 A1 全阶梯权威配置(合同 §15.1;D5-6 SCOPED_GO 授权)
# 阶梯=§15.1 八点截断于 G1a 授权 0.075(0.10 截断)——WP3 四点 + 净新增 {0.003, 0.02, 0.03},
# 单 run 全阶梯:参照点(0.001)/零驱底板/旧壁对照 run 内自含,单一溯源(论文 Results II 主表);
# 与 WP3 run `20260802T105444Z`(B 机)的四个重合点构成跨 run 复现行(D5-3 口径)。
# 驱动=fixture v2:规定 θ 符号对 + 实测零均值功率归一化(G₁=T̂₁/P̂₁;D0-4 数值消融口径);
# 协议常数=G1-W 权威口径逐字(ramp 2 / settle 12 / periods 14 / 64 样本/周期 / detrend 0)。

inheritance:
  gas_config: configs/gas_air_10k_d2q37_levelc_dx2p6.yaml
  design_prereg: docs/Phase_5/wp3_go_nogo_decision.md
  wp3_reference_run: docs/Phase_5/M5_runs/wp3_a1_20260802T105444Z_B

a1:                               # 权威协议(预注册;不得按结果逐点调整)
  unit_label: WP4-A1-FULL
  frequency_Hz: 1.0e4
  ny: 48
  nx: 8
  samples_per_period: 64
  eps_ladder: [0.001, 0.003, 0.01, 0.02, 0.03, 0.05, 0.075]  # §15.1 全阶梯(0.10 截断)
  ramp_periods: 2.0               # G1-W 符号对协议逐字
  periods: 14.0
  fit_skip_periods: 12.0
  wall_contrast_eps: 0.05         # 旧壁 DIAGNOSTIC_ONLY 对照点(§15.1 热壁差异输出)
  alpha_extension_ny: [12, 8, 6]  # 谱参考高 k 扩展行(G1-W 仪器逐字)
  oned_legs: true                 # P-1D 的 A1 部分:双分支配对 @wall_contrast_eps
  oned:
    height_over_delta: 15.0       # G3 A1 协议口径
    cells_per_delta: 12.0
    ramp_cycles: 2.0
    n_cycles: 14.0
    settle_cycles: 12.0

a1_smoke:                         # 机器链 smoke(小域短时;非权威)
  unit_label: WP4-A1-FULL
  frequency_Hz: 1.0e4
  ny: 16
  nx: 4
  samples_per_period: 32
  eps_ladder: [0.003, 0.02, 0.03]   # smoke 走净新增三点的链
  ramp_periods: 1.0
  periods: 4.0
  fit_skip_periods: 2.0
  wall_contrast_eps: 0.05
  alpha_extension_ny: [12, 8, 6]
  oned_legs: false

gates:                            # 合法性行(生产 runner:物理数不判门;WP3 逐字)
  mass_drift_max: 1.0e-8
  pair_asymmetry_rel: 5.0e-2
  floor_p2_rel_of_smallest: 1.0e-1
